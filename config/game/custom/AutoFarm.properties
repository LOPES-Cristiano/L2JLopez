# ==============================================================
#                 AutoFarm Premium Configuration
# ==============================================================

# Habilitar o sistema de AutoFarm no servidor (.autofarm, .farmstart, .farmstop, .farmacp)
AllowAutoFarm = True

# --------------------------------------------------------------
#                  MODO GRATUITO / MONETIZACAO
# --------------------------------------------------------------
# Se True, o AutoFarm sera 100% GRATUITO e ilimitado para todos os jogadores (Padrao: True)
# Se False, os jogadores precisarao comprar tempo de uso, usar horas gratis ou ter tempo online
AutoFarmIsFree = True

# Se True, apenas jogadores com status VIP poderao ativar o AutoFarm
AutoFarmOnlyForPremium = False

# Se True, contas VIP usam o AutoFarm gratuitamente mesmo quando AutoFarmIsFree = False
AutoFarmFreeForPremium = True

# Permitir uso de tempo diario gratuito (em minutos) quando AutoFarmIsFree = False
# Exemplo: 180 = 3 horas gratis por dia
AutoFarmOnlineType = False
AutoFarmFreeTime = 0

# Resetar o tempo diario gratuito todos os dias as 06:30 da manha
AutoFarmRefreshTime = False

# Permitir que os jogadores testem o AutoFarm gratuitamente por X horas uma unica vez (Trial)
# Defina 0 para desativar o botao de Trial
AutoFarmGainFreeTime = 0

# Precos para comprar tempo de AutoFarm quando AutoFarmIsFree = False
# Formato: Horas,ItemID,Quantidade ; Horas,ItemID,Quantidade
# Exemplo: 1,57,100000;3,57,250000;5,57,500000 (1h por 100k Adena, 3h por 250k, etc.)
AutoFarmPrices = 1,57,100000;3,57,250000;5,57,500000;8,57,800000;12,57,1200000;24,57,2000000

# --------------------------------------------------------------
#               LIMITES DE CONTAS / IP / HWID
# --------------------------------------------------------------
# Quantidade maxima de personagens usando AutoFarm simultaneamente no mesmo IP/HWID (0 = sem limite)
AutoFarmMaximumActivatedLimits = 2

# Permitir comprar +1 slot extra de AutoFarm para o mesmo IP/HWID
AutoFarmAllowExtendLimits = True

# Preco para expandir o limite de IP/HWID (ItemID,Quantidade)
AutoFarmVisibleLimitsPrice = 57,1000000

# --------------------------------------------------------------
#                 RESTRICOES E EFEITOS VISUAIS
# --------------------------------------------------------------
# Permitir AutoFarm para jogadores portando Cursed Weapons (Zariche / Akamanah)
AutoFarmAllowForCursedWeapon = False

# Desativar o AutoFarm automaticamente se o jogador ficar com Karma / PK
AutoFarmStopIfKarma = False

# Colocar circulo vermelho nos pes do personagem enquanto o AutoFarm estiver ativo
AutoFarmSetRedRing = False

# Efeito visual (AbnormalEffect) no personagem durante o AutoFarm (deixe vazio ou NONE para desativar)
# Exemplos: FLAME, VITALITY, STEALTH, MAGIC_CIRCLE, IMPRISONING_1
AutoFarmAbnormalEffectName =

# IDs de zonas onde nao e permitido ligar o AutoFarm (separados por virgula)
AutoFarmProhibitedZones =

# --------------------------------------------------------------
#             CONFIGURACOES DE COMBATE E SKILLS
# --------------------------------------------------------------
# Intervalo do loop de combate do AutoFarm em milissegundos (Padrao: 500)
AutoFarmTaskTickMs = 500

# Delay extra ao usar skills quando a opcao "Use Skills Extra Delay" estiver marcada (em ms)
AutoFarmExtraDelayMs = 5000

# Porcentagens minimas de MP/HP padrao para cada aba de skills (Attack, Chance, Self, LowLife/Heal)
AutoFarmAttackSkillsMinMpPercent = 10
AutoFarmChanceSkillsMinMpPercent = 10
AutoFarmSelfSkillsMinMpPercent = 10
AutoFarmLowLifeSkillsMinHpPercent = 30

# Chances padrao de uso das skills (1 a 100%)
AutoFarmAttackSkillsDefaultChance = 100
AutoFarmChanceSkillsDefaultChance = 100
AutoFarmSelfSkillsDefaultChance = 100
AutoFarmLowLifeSkillsDefaultChance = 100

# --------------------------------------------------------------
#               CONFIGURACOES DE SUMMON / PET
# --------------------------------------------------------------
AutoFarmSummonAttackMinMpPercent = 10
AutoFarmSummonSelfMinMpPercent = 10
AutoFarmSummonHealMinHpPercent = 30

AutoFarmSummonAttackDefaultChance = 100
AutoFarmSummonSelfDefaultChance = 100
AutoFarmSummonHealDefaultChance = 100

# --------------------------------------------------------------
#             AUTO COMBAT POTIONS (ACP INTEGRADO)
# --------------------------------------------------------------
# Habilitar o painel ACP dentro do AutoFarm
AutoFarmAllowAcp = True

# Cooldown entre uso de pocoes automaticas em milissegundos
AutoFarmAcpCooldownMs = 1000

# IDs dos itens de pocoes de HP e MP usados pelo ACP
AutoFarmAcpHpPotionId = 1539
AutoFarmAcpMpPotionId = 728
AutoFarmAcpCpPotionId = 5592
