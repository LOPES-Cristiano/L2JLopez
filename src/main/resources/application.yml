spring:
  application:
    name: l2jlopez
  datasource:
    url: ${L2_DB_URL:jdbc:mysql://localhost:3306/l2jlopez}
    username: ${L2_DB_USER:l2jlopez}
    password: ${L2_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # db/migration = schema (V1..V999); db/data = dados estaticos do legado (V1xxx). out-of-order permite novas
    # migracoes de schema (V124+) depois que os dados ja foram aplicados.
    locations: classpath:db/migration,classpath:db/data
    out-of-order: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

l2:
  server-name: L2JLopez
  datapack:
    root-dir: ${L2_DATAPACK_DIR:data}
    html-dir: ${L2_DATAPACK_HTML_DIR:data/html}
    xml-dir: ${L2_DATAPACK_XML_DIR:data/xml}
    scripts-dir: ${L2_DATAPACK_SCRIPTS_DIR:data/scripts}
    teleports-file: ${L2_DATAPACK_TELEPORTS_FILE:data/xml/world/teleports.xml}
    buylists-file: ${L2_DATAPACK_BUYLISTS_FILE:data/xml/world/buylists.xml}
  rates:
    xp: 1.0
    sp: 1.0
    adena: 1.0
    drop: 1.0
    spoil: 1.0
  network:
    login-port: 2106
    game-port: 7777
    login-internal-port: 9014
    protocol-min: 730
    protocol-max: 746
  login:
    listen: true
    # Igual ao legado (AutoCreateAccounts=True): qualquer login novo cria a conta. Desligue em producao.
    auto-create-accounts: ${L2_AUTO_CREATE_ACCOUNTS:true}
    max-account-creations-per-ip: 2
    game-server-host: ${L2_GAME_HOST:127.0.0.1}
    max-players: 500
    show-licence: true
  game:
    listen: true
    # StartingAdena do custom.properties do L2JDream (o padrao do L2J puro e 0).
    starting-adena: ${L2_STARTING_ADENA:10000000}
  features:
    autofarm: { enabled: true }
    dressme: { enabled: true }
    pvp-rank: { enabled: true }
    reset: { enabled: true }
    roulette: { enabled: true }
    aio: { enabled: true }
    vip: { enabled: true }
    achievements: { enabled: true }
    vote: { enabled: false }
    quake: { enabled: true }
