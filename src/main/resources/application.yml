spring:
  application:
    name: l2jlopez
  datasource:
    url: ${L2_DB_URL:jdbc:mysql://localhost:3306/l2jlopez}
    username: ${L2_DB_USER:root}
    password: ${L2_DB_PASSWORD:159753}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # db/migration = schema (V1..V999); db/data = dados estaticos do legado (V1xxx). out-of-order permite novas
    # migracoes de schema (V124+) depois que os dados ja foram aplicados.
    locations: classpath:db/migration,classpath:db/data
    out-of-order: true
  devtools:
    restart:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
