<html><title>Mods Menu</title><body>
<center>
<table width=260 bgcolor="000000">
	<tr>
		<td><button value="Main" action="bypass -h admin_admin" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Game" action="bypass -h admin_admin2" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Effects" action="bypass -h admin_admin3" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Server" action="bypass -h admin_admin4" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Mods" action="bypass -h admin_admin5" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
<font color="FF9900">_______________________________________</font>
<table width=260>
	<tr>
		<td width=65><font color="LEVEL">QuickBox:</font></td>
		<td width=130><edit var="menu_command" width=130 height=15></td>
		<td width=65><button value="Buscar" action="bypass -h admin_search $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
<table width=260 bgcolor="000000">
	<tr>
		<td><button value="Busca NPC" action="bypass -h admin_find_npc $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Busca Item" action="bypass -h admin_find_item $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Busca Skill" action="bypass -h admin_find_skill $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Busca Char" action="bypass -h admin_find_character $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
<font color="FF9900">_______________________________________</font>
<font color="FF9900">GM Speed</font>
<table width=260 bgcolor="000000">
	<tr>
		<td><button value="Speed 0" action="bypass -h admin_speed 0" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Speed 1" action="bypass -h admin_speed 1" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Speed 2" action="bypass -h admin_speed 2" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Speed 3" action="bypass -h admin_speed 3" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Speed 4" action="bypass -h admin_speed 4" width=52 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
<font color="FF9900">Clan & Services</font>
<table width=260 bgcolor="000000">
	<tr>
		<td><button value="Clan Full" action="bypass -h admin_clanfull $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Noblesse" action="bypass -h admin_setnoble $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Hero" action="bypass -h admin_manualhero $menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="C. Hall" action="bypass -h admin_clanhall" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
<font color="FF9900">Team Control / TvT</font>
<table width=260 bgcolor="000000">
	<tr>
		<td><button value="Team Azul" action="bypass -h admin_setteam1" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Team Rojo" action="bypass -h admin_setteam2" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Rango Azul" action="bypass -h admin_rangesetteam1" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Rango Rojo" action="bypass -h admin_rangesetteam2" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
<table width=130 bgcolor="000000">
	<tr>
		<td><button value="Sacar" action="bypass -h admin_clearteam" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Eliminar" action="bypass -h admin_rangeclearteam" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
<font color="FF9900">Champion Mobs</font>
<table width=260 bgcolor="000000">
	<tr>
		<td><button value="Enable" action="bypass -h admin_set_mod ChampionEnable=true" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Disable" action="bypass -h admin_set_mod ChampionEnable=false" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="Freq." action="bypass -h admin_set_mod ChampionFrequency=$menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		<td><button value="xHP" action="bypass -h admin_set_mod ChampionHp=$menu_command" width=65 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
	</tr>
</table>
</center>
</body></html>
