<html><title>Game Control Panel</title><body>
<center>
<table width=270>
<tr>
  <td align=center><button value="Main" action="bypass -h admin_admin" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="ALT+G" action="bypass -h admin_altg" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Players" action="bypass -h admin_players" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Server" action="bypass -h admin_server" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Tele" action="bypass -h admin_show_moves" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td width=90><font color="LEVEL">Texto / Valor:</font></td>
  <td width=180><edit var="qbox" width=170 height=16></td>
</tr>
</table>

<table width=270>
<tr>
  <td><font color="00FFBB">Edicao Rapida do Alvo</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Mudar Nome" action="bypass -h admin_changename $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Mudar Titulo" action="bypass -h admin_settitle $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Editar Char" action="bypass -h admin_edit_char" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Gerenciamento de Clas</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Criar Cla" action="bypass -h admin_pledge create $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Deletar Cla" action="bypass -h admin_pledge dismiss $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Nivel Cla" action="bypass -h admin_pledge setlevel $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td align=center><button value="Reputacao" action="bypass -h admin_pledge rep $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Castelos" action="bypass -h admin_siege" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Fortalezas" action="bypass -h admin_fortsiege" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Armas Amaldicoadas (Cursed Weapons)</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Status Armas" action="bypass -h admin_cw_info_menu" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Adicionar CW" action="bypass -h admin_cw_add $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Remover CW" action="bypass -h admin_cw_remove $qbox" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Seven Signs & Mammon</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Blacksmith" action="bypass -h admin_mammon_find 1" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Merchant" action="bypass -h admin_mammon_find 2" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Prox Periodo" action="bypass -h admin_ss_period_change" width=85 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

</center>
</body></html>
