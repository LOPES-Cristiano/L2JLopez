<html><title>Announcement Control Panel</title><body>
<center>
<table width=270>
<tr>
  <td align=center><button value="Main" action="bypass -h admin_admin" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="ALT+G" action="bypass -h admin_altg" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Players" action="bypass -h admin_players" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Server" action="bypass -h admin_server" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Tele" action="bypass -h admin_show_moves" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="FFBB00">Texto do Anuncio Global:</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><multiedit var="new_announcement" width=260 height=45></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Anuncio Padrao" action="bypass -h admin_announce $new_announcement" width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Anuncio Critico (Tela)" action="bypass -h admin_announce_critical $new_announcement" width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Anuncios Rapidos Pre-definidos</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Reinicio em 5m" action="bypass -h admin_announce O servidor sera reiniciado em 5 minutos para manutencao." width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Reinicio em 1m" action="bypass -h admin_announce_critical ATENCAO: Reinicio em 1 minuto! Por favor, desconectem-se em local seguro." width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td align=center><button value="Evento PvP Aberto" action="bypass -h admin_announce_critical Evento PvP Aberto! Teleportem-se atraves do NPC de Eventos." width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Torneio Aberto" action="bypass -h admin_announce_critical Inscricoes para o Torneio Abertas! Fale com o Tournament Manager." width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><button value="Atualizar Pagina" action="bypass -h admin_announce_menu" width=150 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

</center>
</body></html>
