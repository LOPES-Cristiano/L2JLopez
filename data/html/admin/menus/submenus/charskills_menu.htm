<html><title>Character Skills Manager</title><body>
<center>
<table width=270>
<tr>
  <td align=center><button value="Main" action="bypass -h admin_admin" width=50 height=21 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
  <td align=center><button value="ALT+G" action="bypass -h admin_altg" width=50 height=21 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
  <td align=center><button value="Players" action="bypass -h admin_players" width=50 height=21 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
  <td align=center><button value="Editar" action="bypass -h admin_edit_char" width=50 height=21 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
  <td align=center><button value="Info" action="bypass -h admin_charinfo" width=50 height=21 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><font color="LEVEL">%name%</font> - Lv %level% (%class%)</td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="8FA8BE">Acoes Globais de Habilidades</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Aprender Tudo da Classe" action="bypass -h admin_give_all_skills" width=204 height=20 back="sek.cbui36" fore="sek.cbui75"></td>
</tr>
<tr>
  <td align=center><button value="Resetar Cooldowns / Reuso" action="bypass -h admin_clear_skill_reuse" width=204 height=20 back="sek.cbui36" fore="sek.cbui75"></td>
</tr>
<tr>
  <td align=center><button value="Remover Todas as Skills" action="bypass -h admin_remove_all_skills" width=204 height=20 back="sek.cbui36" fore="sek.cbui75"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="8FA8BE">Pesquisar ou Adicionar Skill Especifica</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Abrir Menu de Skills" action="bypass -h admin_show_skills" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
  <td align=center><button value="Busca Flexivel ALT+G" action="bypass -h admin_altg" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
</table>

</center>
</body></html>
