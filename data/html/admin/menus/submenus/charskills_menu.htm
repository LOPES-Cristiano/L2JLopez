<html><title>Character Skills Manager</title><body>
<center>
<table width=270>
<tr>
  <td align=center><button value="Main" action="bypass -h admin_admin" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="ALT+G" action="bypass -h admin_altg" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Players" action="bypass -h admin_players" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Editar" action="bypass -h admin_edit_char" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Info" action="bypass -h admin_charinfo" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><font color="LEVEL">%name%</font> - Lv %level% (%class%)</td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Acoes Globais de Habilidades</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Aprender Tudo da Classe" action="bypass -h admin_give_all_skills" width=220 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td align=center><button value="Resetar Cooldowns / Reuso" action="bypass -h admin_clear_skill_reuse" width=220 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td align=center><button value="Remover Todas as Skills" action="bypass -h admin_remove_all_skills" width=220 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Pesquisar ou Adicionar Skill Especifica</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Abrir Menu de Skills" action="bypass -h admin_show_skills" width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Busca Flexivel ALT+G" action="bypass -h admin_altg" width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

</center>
</body></html>
