<html><title>Character Editor</title><body>
<center>
<table width=270>
<tr>
  <td align=center><button value="Main" action="bypass -h admin_admin" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="ALT+G" action="bypass -h admin_altg" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Players" action="bypass -h admin_players" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Info" action="bypass -h admin_charinfo" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Skills" action="bypass -h admin_show_skills" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><font color="LEVEL">Editando: %name% (Lv %level%)</font></td>
</tr>
</table>

<table width=270 bgcolor="000000">
<tr>
  <td align=center><font color="87CEFA">HP:</font> %currenthp%/%maxhp%</td>
  <td align=center><font color="87CEFA">MP:</font> %currentmp%/%maxmp%</td>
  <td align=center><font color="87CEFA">CP:</font> %currentcp%/%maxcp%</td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Atributos Individuais</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td width=100>Novo Nome:</td>
  <td width=100><edit width=95 height=16 var="name"></td>
  <td width=60><button value="Salvar" action="bypass -h admin_changename $name" width=55 height=20 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
</tr>
<tr>
  <td width=100>Novo Titulo:</td>
  <td width=100><edit width=95 height=16 var="title"></td>
  <td width=60><button value="Salvar" action="bypass -h admin_settitle $title" width=55 height=20 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
</tr>
<tr>
  <td width=100>Novo Level (1-80):</td>
  <td width=100><edit width=95 height=16 var="lvl"></td>
  <td width=60><button value="Salvar" action="bypass -h admin_setlevel $lvl" width=55 height=20 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
</tr>
<tr>
  <td width=100>Recomendacoes:</td>
  <td width=100><edit width=95 height=16 var="reco"></td>
  <td width=60><button value="Salvar" action="bypass -h admin_rec $reco" width=55 height=20 back="L2UI_CH3.smallbutton1_over" fore="L2UI_CH3.smallbutton1"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><button value="Mudar Classe" action="bypass -h admin_setclass" width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="SubClasses" action="bypass -h admin_subclass" width=130 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Editar Status e PK/PvP</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td width=60>HP:</td><td><edit var="hp" width=65 height=16></td>
  <td width=60>PvP Kills:</td><td><edit var="pvpkills" width=65 height=16></td>
</tr>
<tr>
  <td width=60>MP:</td><td><edit var="mp" width=65 height=16></td>
  <td width=60>PK Kills:</td><td><edit var="pkkills" width=65 height=16></td>
</tr>
<tr>
  <td width=60>CP:</td><td><edit var="cp" width=65 height=16></td>
  <td width=60>Karma:</td><td><edit var="karma" width=65 height=16></td>
</tr>
</table>

<br>
<center><button value="Salvar Status" action="bypass -h admin_save_modifications $hp $mp $cp $karma $pvpkills $pkkills" width=160 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></center>

</center>
</body></html>
