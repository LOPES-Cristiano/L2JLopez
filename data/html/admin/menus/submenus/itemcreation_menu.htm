<html><title>Criacao e Busca de Itens</title><body>
<center>
<table bgcolor="000000" width=290>
<tr>
<td width=45><a action="bypass -h admin_admin" width=54 height=19><font color="FFD306">Main</font></a></td>
<td width=190 align=center><font color="LEVEL"><b>Criacao & Busca de Itens</b></font></td>
<td width=45 align=right><a action="bypass -h admin_admin" width=54 height=19><font color="FFD306">Voltar</font></a></td>
</tr>
</table>
<center><img src="L2UI.SquareGray" width=300 height=1></center>
<br>

<!-- BUSCA DE ITENS POR NOME -->
<table width=290 bgcolor="181818">
<tr>
<td colspan=2 align=center><font color="LEVEL">Buscar Item por Nome ou ID</font></td>
</tr>
<tr>
<td width=180><edit var="search_item" width=175 height=15></td>
<td width=105 align=right><button value="Buscar Item" action="bypass -h admin_find_item $search_item" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
</tr>
</table>
<br>

<center><img src="L2UI.SquareGray" width=300 height=1></center>
<font color="LEVEL">Criacao Direta por ID</font>
<center><img src="L2UI.SquareGray" width=300 height=1></center>

<table bgcolor="000000" width="300">
	<tr>
		<td width=90><font color="B09979">ID do Item:</font></td>
		<td width=110><font color="B09979">Quantidade:</font></td>
		<td width=95></td>
	</tr>
	<tr>
		<td><edit var="itemid" width=80></td>
		<td><edit var="itemnum" width=95 type=number></td>
		<td align=right><button value="Criar (Eu)" action="bypass -h admin_create_item $itemid $itemnum" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
	</tr>
	<tr>
		<td colspan=2 align=right><font color="808080">Para o alvo selecionado:</font></td>
		<td align=right><button value="Dar ao Alvo" action="bypass -h admin_give_item_target $itemid $itemnum" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
	</tr>
	<tr>
		<td colspan=2 align=right><font color="808080">Para todos online:</font></td>
		<td align=right><button value="Dar a Todos" action="bypass -h admin_give_item_to_all $itemid $itemnum" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
	</tr>
	<tr>
		<td colspan=2 align=right><font color="808080">Limpar itens nao equipados:</font></td>
		<td align=right><button value="Limpar Inv" action="bypass -h admin_clean_inventory" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
	</tr>
</table>

<br>
<center><img src="L2UI.SquareGray" width=300 height=1></center>

<center><img src="L2UI.SquareGray" width=300 height=1></center>

<td><button value="A. Adena 10kk" action="bypass -h admin_create_item 5575 10000000" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td><button value="Fest. Adena" action="bypass -h admin_create_item 6673 500" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
<td><button value="B. Scroll Weapon S" action="bypass -h admin_create_item 6577 50" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td><button value="B. Scroll Armor S" action="bypass -h admin_create_item 6578 50" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td><button value="Soul Crystal 13" action="bypass -h admin_create_item 4665 1" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>

<tr>

<td><button value="B. Sp.shots S (10k)" action="bypass -h admin_create_item 3952 10000" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td><button value="Mana Potions" action="bypass -h admin_create_item 728 500" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
<td><button value="Antharas Earring" action="bypass -h admin_create_item 6656 1" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td><button value="Valakas Necklace" action="bypass -h admin_create_item 6657 1" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td><button value="Baium Ring" action="bypass -h admin_create_item 6658 1" width=95 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
