<html><title>Reload Control Panel</title><body>
<center>
<table width=270>
<tr>
  <td align=center><button value="Main" action="bypass -h admin_admin" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="ALT+G" action="bypass -h admin_altg" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Players" action="bypass -h admin_players" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Server" action="bypass -h admin_server" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Tele" action="bypass -h admin_show_moves" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><font color="FFBB00">Recarregar Servidor a Quente (Hot Reload)</font></td>
</tr>
<tr>
  <td align=center><font color="B0B0B0">Aplica mudancas de arquivos sem reiniciar</font></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td width=170><font color="00FFBB">Configuracoes (.properties)</font></td>
  <td width=100 align=center><button value="Recarregar" action="bypass -h admin_reload config" width=90 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td width=170><font color="00FFBB">Spawns (Banco de Dados)</font></td>
  <td width=100 align=center><button value="Recarregar" action="bypass -h admin_reload spawnlist" width=90 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td width=170><font color="00FFBB">HTMLs e Menus</font></td>
  <td width=100 align=center><button value="Recarregar" action="bypass -h admin_reload html" width=90 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td width=170><font color="00FFBB">Habilidades (Skills)</font></td>
  <td width=100 align=center><button value="Recarregar" action="bypass -h admin_reload skills" width=90 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td width=170><font color="00FFBB">Lojas Multisell</font></td>
  <td width=100 align=center><button value="Recarregar" action="bypass -h admin_reload multisell" width=90 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td width=170><font color="00FFBB">Teleportes</font></td>
  <td width=100 align=center><button value="Recarregar" action="bypass -h admin_reload teleport" width=90 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td width=170><font color="00FFBB">Balanco de Olimpiadas</font></td>
  <td width=100 align=center><button value="Recarregar" action="bypass -h admin_reload oly" width=90 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><button value="Limpeza de Memoria (GC)" action="bypass -h admin_cleanup" width=200 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

</center>
</body></html>
