<html><title>ALT + G - Game Master Tools</title><body>
<center>
<table bgcolor="000000" width=300>
<tr>
  <td><a action="bypass -h admin_admin" width=50 height=19><font color="FFD306">Main</font></a></td>
  <td><a action="bypass -h admin_find_npc" width=50 height=19><font color="00FF7F">NPCs</font></a></td>
  <td><a action="bypass -h admin_find_item" width=50 height=19><font color="00FFFF">Items</font></a></td>
  <td><a action="bypass -h admin_find_skill" width=50 height=19><font color="FFD700">Skills</font></a></td>
  <td><a action="bypass -h admin_charlist" width=50 height=19><font color="FF69B4">Players</font></a></td>
  <td><a action="bypass -h admin_show_moves" width=50 height=19><font color="FFA500">Tele</font></a></td>
</tr>
</table>
<center><img src="L2UI.SquareGray" width=300 height=1></center>
<br>

<table width=290 bgcolor="181818">
<tr>
<td colspan=2 align=center><font color="LEVEL"><b>CONSULTAS INTEGRADAS ALT + G</b></font></td>
</tr>
<tr>
<td width=180><edit var="search_term" width=175 height=15></td>
<td width=105 align=right><button value="Buscar Tudo" action="bypass -h admin_search $search_term" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
</tr>
<tr>
<td colspan=2 align=center>
<button value="Buscar NPC" action="bypass -h admin_find_npc $search_term" width=85 height=19 back="sek.cbui94" fore="sek.cbui94"> 
<button value="Buscar Item" action="bypass -h admin_find_item $search_term" width=85 height=19 back="sek.cbui94" fore="sek.cbui94"> 
<button value="Buscar Skill" action="bypass -h admin_find_skill $search_term" width=85 height=19 back="sek.cbui94" fore="sek.cbui94">
</td>
</tr>
</table>
<br>

<center><img src="L2UI.SquareGray" width=300 height=1></center>
<font color="LEVEL">Alvo Selecionado (Target)</font>
<center><img src="L2UI.SquareGray" width=300 height=1></center>

<table width=290 bgcolor="181818">
<tr><td width=140><font color="B09979">Nome:</font> %name%</td><td width=140><font color="B09979">Level:</font> %level%</td></tr>
<tr><td width=140><font color="B09979">HP:</font> %currenthp% / %maxhp%</td><td width=140><font color="B09979">MP:</font> %currentmp% / %maxmp%</td></tr>
<tr><td width=140><font color="B09979">CP:</font> %currentcp% / %maxcp%</td><td width=140><font color="B09979">Classe:</font> %class%</td></tr>
<tr><td colspan=2><font color="B09979">Titulo:</font> %title%</td></tr>
</table>

<table width=290>
<tr>
<td align=center><button value="Heal" action="bypass -h admin_heal" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Kill" action="bypass -h admin_kill" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Resurrect" action="bypass -h admin_resurrect" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Cancel Buffs" action="bypass -h admin_cancel" width=75 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
<td align=center><button value="Para" action="bypass -h admin_para" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Unpara" action="bypass -h admin_unpara" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Tele to" action="bypass -h admin_goto" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Recall" action="bypass -h admin_recall" width=75 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
<td align=center><button value="Status" action="bypass -h admin_altg" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Char Info" action="bypass -h admin_charinfo" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Kick" action="bypass -h admin_kick %name%" width=65 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
<td align=center><button value="Delete NPC" action="bypass -h admin_delete" width=75 height=19 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<center><img src="L2UI.SquareGray" width=300 height=1></center>
<font color="LEVEL">Ferramentas Pessoais do GM</font>
<center><img src="L2UI.SquareGray" width=300 height=1></center>

<table width=290>
<tr>
<td><button value="Invul (Imortal)" action="bypass -h admin_invul" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
<td><button value="Invis (Fantasma)" action="bypass -h admin_invis" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
<td><button value="Visible" action="bypass -h admin_vis" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
</tr>
<tr>
<td><button value="Super Haste 4" action="bypass -h admin_gmspeed 4" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
<td><button value="Speed Normal" action="bypass -h admin_gmspeed 0" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
<td><button value="Limpar Lixo (GC)" action="bypass -h admin_cleanup" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
</tr>
<tr>
<td><button value="Montar Wyvern" action="bypass -h admin_ride_wyvern" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
<td><button value="Montar Strider" action="bypass -h admin_ride_strider" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
<td><button value="Desmontar" action="bypass -h admin_unride" width=95 height=21 back="L2UI_CH3.bigbutton_over" fore="L2UI_CH3.bigbutton"></td>
</tr>
</table>

<br><center><img src="L2UI.SquareGray" width=300 height=1></center>
<font color="666666">Lopez L2J Admin Suite - Alt+G Enhanced Hub</font>
</center></body></html>
