<html><title>Server Control Panel</title><body>
<center>
<table width=270>
<tr>
  <td align=center><button value="Main" action="bypass -h admin_admin" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="ALT+G" action="bypass -h admin_altg" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Players" action="bypass -h admin_players" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Game" action="bypass -h admin_gamemenu" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Tele" action="bypass -h admin_show_moves" width=52 height=20 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td width=100><font color="LEVEL">Parametro / Seg:</font></td>
  <td width=170><edit var="qbox" width=160 height=16></td>
</tr>
</table>

<table width=270>
<tr>
  <td><font color="00FFBB">Controle do Servidor</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Shutdown" action="bypass -h admin_shutdown $qbox" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Restart" action="bypass -h admin_restart $qbox" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Abortar" action="bypass -h admin_abort" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Kick All" action="bypass -h admin_kickall" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
<tr>
  <td align=center><button value="Apenas GM" action="bypass -h admin_onlygm" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Liberar" action="bypass -h admin_forall" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Limpar Mem" action="bypass -h admin_cleanup" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Max Players" action="bypass -h admin_maxplayer $qbox" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Recarregar Modulos (Reload)</font></td>
</tr>
</table>

<table width=270>
<tr>
  <td align=center><button value="Spawns" action="bypass -h admin_reload spawns" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="HTMLs" action="bypass -h admin_reload html" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Scripts" action="bypass -h admin_reload scripts" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
  <td align=center><button value="Olympiad" action="bypass -h admin_reload oly" width=65 height=21 back="L2UI_CH3.smallbutton2_over" fore="L2UI_CH3.smallbutton2"></td>
</tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td><font color="00FFBB">Informacoes do Servidor</font></td>
</tr>
</table>

<table width=270 bgcolor="000000">
<tr><td width=90><font color="LEVEL">Memoria:</font></td><td width=180>%meminfo%</td></tr>
<tr><td width=90><font color="LEVEL">Sistema:</font></td><td width=180>%os%</td></tr>
<tr><td width=90><font color="LEVEL">Uptime:</font></td><td width=180>%time%</td></tr>
<tr><td width=90><font color="LEVEL">Online:</font></td><td width=180><font color="00FF00">%online%</font> / %max% max</td></tr>
<tr><td width=90><font color="LEVEL">Geodata:</font></td><td width=180>%geo%</td></tr>
<tr><td width=90><font color="LEVEL">Target Atual:</font></td><td width=180><font color="FFFF77">%target%</font></td></tr>
</table>

<img src="L2UI.SquareGray" width=270 height=1>

<table width=270>
<tr>
  <td align=center><button value="Salvar Oly" action="bypass -h admin_saveolymp" width=130 height=21 back="L2UI_CH3.bigbutton3_over" fore="L2UI_CH3.bigbutton3"></td>
  <td align=center><button value="Encerrar Oly" action="bypass -h admin_endolympiad" width=130 height=21 back="L2UI_CH3.bigbutton3_over" fore="L2UI_CH3.bigbutton3"></td>
</tr>
</table>

</center>
</body></html>
