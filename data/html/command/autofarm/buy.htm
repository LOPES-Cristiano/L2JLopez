<html><title>Auto Farm Buy Menu</title><body>
<center>
<br>
<table width=260>
	<tr>
		<td width=260>To receive an auto farm, it is necessary to specify choose days which the auto farm will be issued.</td>
	</tr>
</table>
<br>
<table width=220>
	<tr>
		<td width=120>Choose farm hours:</td>
		<td><combobox width=100 var=selectid list="%time%"></td>
	</tr>
</table>
<br>
<table width=220 height=140>
<tr>
<td><button value="Buy Auto Farm" action="bypass -h voice_buyfarmTime $selectid" width=120 height=25 back="L2UI_CH3.bigbutton2_down" fore="L2UI_CH3.bigbutton2"></td><td>%freeUse%</td>
</tr>
</table>
<button value="Back" action="bypass -h voice_autofarm" width=80 height=25 back="L2UI_CH3.bigbutton2_down" fore="L2UI_CH3.bigbutton2">
</center>
</body></html>
