<html noscrollbar><title>AutoFarm</title><body>
<table width=290>
	<tr>
		<td width=38 align=center><img src="icon.skill1401" width=32 height=32></td>
		<td width=160>%activate%</td>
		<td width=32 align=center>%status%</td>
		<td width=60 align=right>%button%</td>
	</tr>
</table>
<img src="L2UI.SquareWhite" width=290 height=1>
<table width=290>
	<tr>
		<td width=50><button value="ACP" action="bypass -h voice_farmacp" width=45 height=20 back="L2UI_CH3.bigbutton2_down" fore="L2UI_CH3.bigbutton2"></td>
		<td width=80 align=right>Farm type:</td>
		%farmType%
	</tr>
</table>
<img src="L2UI.SquareWhite" width=290 height=1>
<table width=290>
	<tr>
		<td width=20><button action="%assist_bypass%" value="" width=15 height=15 back="%assist_img%" fore="%assist_img%"></td>
		<td width=125>Assist Party Leader</td>
		<td width=20><button action="%assistMAttack_bypass%" value="" width=15 height=15 back="%assistMAttack_img%" fore="%assistMAttack_img%"></td>
		<td width=115>Assist Mobs</td>
	</tr>
</table>
<table width=290>
	<tr>
		<td width=20><button action="%refreshSkills% $selectid" value="" width=15 height=15 back="L2UI.CheckBox_checked" fore="L2UI.CheckBox"></td>
		<td width=175>Refresh skills by shortcuts</td>
		<td width=90 align=left><combobox width=45 var=selectid list="%shortcutPage%"></td>
	</tr>
</table>
<img src="L2UI.SquareWhite" width=290 height=1>
<table width=290 cellspacing=0 cellpadding=0>
	<tr>
		<td width=72><button value="ATTACK" action="bypass -h voice_changeSkillType attack" width=72 height=20 back="L2UI_CH3.bigbutton2_down" fore="L2UI_CH3.bigbutton2"></td>
		<td width=72><button value="CHANCE" action="bypass -h voice_changeSkillType chance" width=72 height=20 back="L2UI_CH3.bigbutton2_down" fore="L2UI_CH3.bigbutton2"></td>
		<td width=72><button value="SELF" action="bypass -h voice_changeSkillType self" width=72 height=20 back="L2UI_CH3.bigbutton2_down" fore="L2UI_CH3.bigbutton2"></td>
		<td width=72><button value="HEAL" action="bypass -h voice_changeSkillType heal" width=72 height=20 back="L2UI_CH3.bigbutton2_down" fore="L2UI_CH3.bigbutton2"></td>
	</tr>
</table>
<br1>
<table width=290 cellspacing=0 cellpadding=0>
	<tr>
		%skillList%
	</tr>
</table>
<br1>
<img src="L2UI.SquareWhite" width=290 height=1>
%skillsParam%
<table width=290>
	<tr>
		%distance%
		<td width=150>Search Distance</td>
	</tr>
</table>
<table width=290>
	<tr>
		<td width=25><button action="%tgRestoreMp_bypass%" value="" width=15 height=15 back="%tgRestoreMp_img%" fore="%tgRestoreMp_img%"></td>
		<td width=260>Restore Mp by Target</td>
	</tr>
</table>
</body></html>
