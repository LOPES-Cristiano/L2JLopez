<html>
<body>
<title>NPC Buffer</title>
<center>
<img src="l2font-e.replay_logo-e" width=250 height=80>
<img src="L2UI.SquareWhite" width=270 height=1>
<font color="LEVEL">Macro Schemes (Quick Buff)</font>
<table width=270 border=0 cellspacing=2 cellpadding=1>
<tr>
<td align=center><button value="Fighter Buffs" action="bypass -h npc_%objectId%_fighter" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
<td align=center><button value="Mage Buffs" action="bypass -h npc_%objectId%_mage" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
<tr>
<td align=center><button value="Custom Scheme" action="bypass -h npc_%objectId%_givebuffs 3" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
<td align=center><button value="Edit Schemes" action="bypass -h npc_%objectId%_editschemes 3" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
<tr>
<td align=center><button value="Pet Fighter" action="bypass -h npc_%objectId%_givebuffs 1 pet" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
<td align=center><button value="Pet Mage" action="bypass -h npc_%objectId%_givebuffs 2 pet" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
</table>
<img src="L2UI.SquareWhite" width=270 height=1>
<font color="LEVEL">Select Buffs by Category</font>
<table width=270 border=0 cellspacing=2 cellpadding=1>
<tr>
<td align=center><button value="Buffs" action="bypass -h npc_%objectId%_Chat 1" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
<td align=center><button value="Dances" action="bypass -h npc_%objectId%_Chat 4" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
<tr>
<td align=center><button value="Songs" action="bypass -h npc_%objectId%_Chat 5" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
<td align=center><button value="Prophecy" action="bypass -h npc_%objectId%_Chat 3" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
<tr>
<td align=center><button value="Chants" action="bypass -h npc_%objectId%_Chat 6" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
<td align=center><button value="Overlord" action="bypass -h npc_%objectId%_Chat 7" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
</table>
<button value="Extra / Resists" action="bypass -h npc_%objectId%_Chat 8" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3">
<img src="L2UI.SquareWhite" width=270 height=1>
<table width=270 border=0 cellspacing=2 cellpadding=1>
<tr>
<td align=center><button value="Heal Me (HP/MP/CP)" action="bypass -h npc_%objectId%_restore" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
<td align=center><button value="Cancel Buffs" action="bypass -h npc_%objectId%_cancel" width=134 height=21 back="L2UI_ch3.BigButton3_over" fore="L2UI_ch3.BigButton3"></td>
</tr>
</table>
</center>
</body>
</html>
